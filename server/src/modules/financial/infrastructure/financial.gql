enum TransactionSource {
  ORDER_PAYMENT
  ORDER_REFUND
  EXPENSE
  EXPENSE_REVERSAL
  FIXED_EXPENSE_PAYMENT
  TRANSFER
  MANUAL
}

type Account {
  id: ID!
  name: String!
  currency: String!
  balance: Float!
}

type Transaction {
  id: ID!
  accountId: ID!
  type: String!
  amount: Float!
  currency: String!
  description: String!
  date: String!
  financialDayId: ID!
  source: TransactionSource!
  sourceReferenceId: ID
  createdAt: String!
}

type FinancialDayBalance {
  accountId: ID!
  balance: Float!
}

type FinancialDay {
  id: ID!
  date: String!
  status: String!
  openingBalances: [FinancialDayBalance!]!
  closingBalances: [FinancialDayBalance!]!
  openedAt: String!
  closedAt: String
}

type FinancialDayResult {
  financialDay: FinancialDay
  exchangeRate: Float
}

type ExchangeRate {
  id: ID!
  date: String!
  rate: Float!
}

type ReconciliationDiscrepancy {
  type: String!
  source: TransactionSource!
  referenceId: ID!
  expectedAmount: Float
  actualAmount: Float
  description: String!
}

type ReconciliationReport {
  id: ID
  date: String!
  status: String!
  matchedCount: Int!
  discrepancies: [ReconciliationDiscrepancy!]!
  openingBalance: Float!
  closingBalance: Float!
  totalCredits: Float!
  totalDebits: Float!
  financialDayId: ID!
  createdAt: String!
}

type CloseFinancialDayResult {
  financialDay: FinancialDay!
  reconciliationReport: ReconciliationReport

type PaymentRecord {
  id: ID!
  amount: Float!
  accountId: ID!
  transactionId: ID!
  expenseId: ID!
  paidAt: String!
}

type AccountsPayable {
  id: ID!
  stockLotId: ID!
  supplier: String!
  totalAmount: Float!
  remainingBalance: Float!
  payments: [PaymentRecord!]!
  status: String!
  contextId: ID
  createdAt: String!
  updatedAt: String!
}

type PayAccountsPayablePayload {
  accountsPayable: AccountsPayable!
  transactionId: ID!
  expenseId: ID!
}

type Query {
  getFinancialDayByDate(date: String): FinancialDayResult!
  getAccounts: [Account!]!
  getTransactions(accountId: ID!): [Transaction!]!
  accountsPayables(status: String, supplierName: String, contextId: ID): [AccountsPayable!]!
  accountsPayable(id: ID!): AccountsPayable
}

type Mutation {
  createAccount(name: String!, currency: String!, balance: Float): Account!
  createTransaction(
    accountId: ID!
    type: String!
    amount: Float!
    description: String!
    date: String
    source: TransactionSource
    sourceReferenceId: ID
  ): Transaction!
  deleteTransaction(id: ID!): Boolean!
  updateExchangeRate(date: String, rate: Float!): ExchangeRate!
  openFinancialDay(date: String): FinancialDay!
  closeFinancialDay(date: String, blockOnDiscrepancy: Boolean): CloseFinancialDayResult!
  reconcileFinancialDay(date: String!): ReconciliationReport!
  transferFunds(
    sourceAccountId: ID!
    targetAccountId: ID!
    amount: Float!
    targetAmount: Float
    exchangeRate: Float
    description: String
    date: String
  ): Boolean!
  payAccountsPayable(
    accountsPayableId: ID!
    amount: Float!
    accountId: ID!
  ): PayAccountsPayablePayload!
}
