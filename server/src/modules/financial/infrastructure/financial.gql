type Account {
  id: ID!
  name: String!
  currency: String!
  balance: Float!
}

type Transaction {
  id: ID!
  accountId: ID!
  type: String!
  amount: Float!
  currency: String!
  description: String!
  date: String!
  financialDayId: ID!
  referenceId: ID
  createdAt: String!
}

type FinancialDayBalance {
  accountId: ID!
  balance: Float!
}

type FinancialDay {
  id: ID!
  date: String!
  status: String!
  openingBalances: [FinancialDayBalance!]!
  closingBalances: [FinancialDayBalance!]!
  openedAt: String!
  closedAt: String
}

type FinancialDayResult {
  financialDay: FinancialDay
  exchangeRate: Float
}

type ExchangeRate {
  id: ID!
  date: String!
  rate: Float!
}

type PaymentRecord {
  id: ID!
  amount: Float!
  accountId: ID!
  transactionId: ID!
  expenseId: ID!
  paidAt: String!
}

type AccountsPayable {
  id: ID!
  stockLotId: ID!
  supplier: String!
  totalAmount: Float!
  remainingBalance: Float!
  payments: [PaymentRecord!]!
  status: String!
  contextId: ID
  createdAt: String!
  updatedAt: String!
}

type PayAccountsPayablePayload {
  accountsPayable: AccountsPayable!
  transactionId: ID!
  expenseId: ID!
}

type Query {
  getFinancialDayByDate(date: String): FinancialDayResult!
  getAccounts: [Account!]!
  getTransactions(accountId: ID!): [Transaction!]!
  accountsPayables(status: String, supplierName: String, contextId: ID): [AccountsPayable!]!
  accountsPayable(id: ID!): AccountsPayable
}

type Mutation {
  createAccount(name: String!, currency: String!, balance: Float): Account!
  createTransaction(
    accountId: ID!
    type: String!
    amount: Float!
    description: String!
    date: String
    referenceId: ID
  ): Transaction!
  deleteTransaction(id: ID!): Boolean!
  updateExchangeRate(date: String, rate: Float!): ExchangeRate!
  openFinancialDay(date: String): FinancialDay!
  closeFinancialDay(date: String): FinancialDay!
  transferFunds(
    sourceAccountId: ID!
    targetAccountId: ID!
    amount: Float!
    targetAmount: Float
    exchangeRate: Float
    description: String
    date: String
  ): Boolean!
  payAccountsPayable(
    accountsPayableId: ID!
    amount: Float!
    accountId: ID!
  ): PayAccountsPayablePayload!
}
