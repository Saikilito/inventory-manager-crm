type Token {
  token: String!
}
type User {
  _id: ID
  user: String
  name: String
  rol: String
}
type Query {
  getUser: User
}
type Mutation {
  setUser(
    user: String!
    name: String!
    password: String!
    rol: String!
  ): Boolean!
  userAuthentication(user: String!, password: String!): Token!
}
