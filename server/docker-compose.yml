services:
  mongodb:
    image: mongo:7.0
    container_name: inventory-manager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: CRM-Apollo
    networks:
      - crm-network
    healthcheck:
      test: mongosh --quiet --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  crm-network:
    driver: bridge

volumes:
  mongodb_data:
